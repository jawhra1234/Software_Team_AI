[project]
name = "ai-swe-workspace"
version = "0.1.0"
description = "AI Software Engineering Workspace — supervised coding-agent orchestrator (backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "ollama>=0.3",
    "langfuse>=2.0",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Lint / format — ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Asserts are expected in tests; E501 relaxed because tests embed source-code fixtures.
"tests/*" = ["S101", "E501"]

# ---------------------------------------------------------------------------
# Type checking — mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Third-party libraries without bundled type stubs.
[[tool.mypy.overrides]]
module = [
    "ollama.*",
    "langfuse.*",
    "tree_sitter.*",
    "tree_sitter_language_pack.*",
    "rank_bm25.*",
    "pgvector.*",
]
ignore_missing_imports = true

# numpy (transitive via rank-bm25) ships 3.12-syntax stubs that mypy can't parse
# under python_version=3.11; skip following into it. We never use numpy directly.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests — pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Default run is hermetic: integration tests are opt-in via `pytest -m integration`.
addopts = "-ra -m 'not integration'"
markers = [
    "integration: tests that require a live external service (e.g. Ollama, Postgres)",
]
